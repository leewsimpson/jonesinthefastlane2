# CI-01, CI-04, CI-05, CI-06: lint, typecheck, content validation, tests, build, bundle budget, balance sim, audit.
name: ci

# Runs on main only to save Actions minutes; dispatch manually to check a branch before merging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate content
        run: pnpm content:validate
      - name: Unit and property tests
        run: pnpm test
      - name: Random-play replay check (52 weeks)
        run: pnpm sim -- --games 20 --weeks 52
      - name: Build
        run: pnpm build
      - name: Bundle size (initial JS ≤ 300 KB gz)
        run: |
          set -o pipefail
          pnpm size 2>&1 | tee size.txt
          {
            echo '### Bundle size'
            echo '```'
            sed -n '/Size limit/,$p' size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # CI-04: the balance sim, in parallel with `checks` to stay inside the 8-minute budget. Hard KPI bands fail the
  # job; the summary table, with a paired comparison against the last green `main` run, goes to the job summary.
  balance:
    runs-on: ubuntu-latest
    # The 8-minute CI budget (ci-cd §1) is the limit.
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Last green main report (compare base)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow ci.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then gh run download "$run" --name sim-report --dir base || true; fi
      - name: Balance sim (2k games, KPI bands)
        run: |
          base=()
          if [ -f base/report.json ]; then base=(--base base/report.json); fi
          pnpm sim run --games 2000 --out sim-out "${base[@]}"
      - name: Job summary
        if: always()
        run: if [ -f sim-out/summary.md ]; then cat sim-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sim-report
          path: |
            sim-out/report.json
            sim-out/summary.md
          retention-days: 30
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Dependency audit (high and above fails)
        run: pnpm audit --audit-level high
