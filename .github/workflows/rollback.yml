# CD-05: roll back the web app and the API. Runbook: docs/ci-cd.md §6.
#   target production, no sha  → Cloudflare's instant rollback: the previous production Pages deployment and the
#                                 previous Worker version.
#   target production|main + sha → redeploy that commit's main build (artifact web-dist-<sha>) and its Worker.
# Rollbacks never run migrations: migrations are backward compatible (CD-04), so older code runs on the newer schema.
name: rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to roll back
        type: choice
        options: [production, main]
        default: production
      sha:
        description: Commit to go back to (needs a green main deploy). Empty = the previous deploy (production only).
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Shares production's group, so a rollback never races a deploy.
  group: ${{ inputs.target == 'production' && 'production' || 'main-deploy' }}
  cancel-in-progress: false

env:
  PAGES_PROJECT: fastlane
  PAGES_HOST: fastlane-e6g.pages.dev

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target == 'production' && 'production' || 'preview' }}
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
      INPUT_SHA: ${{ inputs.sha }}
    steps:
      - name: Check inputs
        run: |
          if [ "$TARGET" = main ] && [ -z "$INPUT_SHA" ]; then
            echo "::error::Rolling back main needs a sha: the main alias has no deployment history to step back through."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── Instant rollback (production, no sha) ──────────────────────────────────────────────────────────────────
      - name: Roll back Pages to the previous production deployment
        if: inputs.sha == ''
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          # Step back from whatever is live now (an earlier rollback may have moved it), not from the newest deploy.
          live=$(curl -fsS "${auth[@]}" "$api" | jq -r '.result.canonical_deployment.id')
          previous=$(curl -fsS "${auth[@]}" "$api/deployments?env=production&per_page=25" | jq -r --arg live "$live" '
            [.result[] | select(.latest_stage.name == "deploy" and .latest_stage.status == "success")] as $ok
            | ($ok | map(.id) | index($live)) as $i
            | if $i == null then null else $ok[$i + 1].id end')
          if [ -z "$previous" ] || [ "$previous" = null ]; then
            echo "::error::No earlier successful production deployment to roll back to."; exit 1
          fi
          echo "Rolling Pages back to deployment $previous"
          curl -fsS -X POST "${auth[@]}" "$api/deployments/$previous/rollback" | jq -e '.success' > /dev/null

      - name: Roll back the Worker to its previous version
        if: inputs.sha == ''
        working-directory: apps/api
        run: pnpm exec wrangler rollback --env production --message "rollback by ${{ github.actor }}" --yes

      # ── Redeploy a known-good commit (either target, with sha) ────────────────────────────────────────────────
      - name: Find that commit's main build
        if: inputs.sha != ''
        id: build
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow main.yml --branch main --commit "$INPUT_SHA" --status success \
            --json databaseId --jq '.[0].databaseId')
          [ -n "$run" ] && [ "$run" != null ] || { echo "::error::No green main deploy for $INPUT_SHA"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download that build
        if: inputs.sha != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-${{ inputs.sha }}
          path: rollback-dist
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}

      - name: Redeploy the Worker and web app
        if: inputs.sha != ''
        id: redeploy
        run: |
          set -o pipefail
          cd apps/api
          if [ "$TARGET" = production ]; then
            pnpm exec wrangler deploy --env production --var "VERSION:$INPUT_SHA" --message "rollback to $INPUT_SHA"
            api_url=https://fastlane-api-production.leewsimpson.workers.dev
            branch=production
          else
            pnpm exec wrangler versions upload --env preview --preview-alias main --var "VERSION:$INPUT_SHA" \
              --message "rollback main to $INPUT_SHA" 2>&1 | tee upload.log
            api_url=$(grep -oE "https://main-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
            test -n "$api_url" || { echo "::error::No main alias URL in wrangler output"; exit 1; }
            branch=main
          fi
          environment=$([ "$TARGET" = production ] && echo production || echo preview)
          printf '{\n  "environment": "%s",\n  "apiBase": "%s"\n}\n' "$environment" "$api_url" > "$GITHUB_WORKSPACE/rollback-dist/config.json"
          pnpm exec wrangler pages deploy "$GITHUB_WORKSPACE/rollback-dist" --project-name "$PAGES_PROJECT" \
            --branch "$branch" --commit-hash "$INPUT_SHA" --commit-dirty=true
          echo "api=$api_url" >> "$GITHUB_OUTPUT"

      # ── Check what is live now ─────────────────────────────────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          if [ "$TARGET" = production ]; then
            web=https://$PAGES_HOST
            api=https://fastlane-api-production.leewsimpson.workers.dev
          else
            web=https://main.$PAGES_HOST
            api="${{ steps.redeploy.outputs.api }}"
          fi
          # An instant rollback goes back to whatever version was live before, so read it rather than expect one.
          sha=${INPUT_SHA:-$(curl -fsS -D - "$api/healthz" -o /dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="x-fastlane-version"{print $2}')}
          .github/scripts/smoke.sh "$web" "$api" "$sha"
          echo "### Rolled back $TARGET to \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
