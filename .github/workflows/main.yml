# CD-02: once CI is green on main, deploy main to the preview environment under the stable `main` alias, migrate the
# preview D1 first (CD-04), smoke test (CD-06) and run a smoke E2E. The exact web build is kept as artifact
# `web-dist-<sha>` so production promotes it without rebuilding (CD-03).
name: main

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: fastlane
  PAGES_HOST: fastlane-e6g.pages.dev
  ALIAS: main
  # The commit CI checked, or the branch head on a manual run.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # Only main is ever deployed here: production promotes these builds, so a dispatch from a branch must not count.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: https://main.fastlane-e6g.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @fastlane/web build

      # The artifact is the build before any environment's config.json is written: every deploy writes its own.
      - name: Upload web build for production
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-${{ env.SHA }}
          path: apps/web/dist
          retention-days: 90
          if-no-files-found: error

      - name: Keep the Pages production branch apart from main
        run: .github/scripts/pages-production-branch.sh "$PAGES_PROJECT"

      # CD-04: migrations first, so the Worker never runs against a schema it doesn't know.
      - name: Migrate preview D1
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply fastlane-db-preview --env preview --remote

      - name: Upload Worker version under the main alias
        id: api
        working-directory: apps/api
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --env preview \
            --preview-alias "$ALIAS" --var "VERSION:$SHA" --message "$ALIAS $SHA" 2>&1 | tee upload.log
          url=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          test -n "$url" || { echo "::error::No preview alias URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write runtime config
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          printf '{\n  "environment": "preview",\n  "apiBase": "%s"\n}\n' "$API_URL" > apps/web/dist/config.json

      - name: Deploy Pages (main alias)
        run: |
          pnpm --filter @fastlane/api exec wrangler pages deploy ../web/dist \
            --project-name "$PAGES_PROJECT" --branch "$ALIAS" --commit-hash "$SHA" --commit-dirty=true

      - name: Smoke test
        run: .github/scripts/smoke.sh "https://${ALIAS}.${PAGES_HOST}" "${{ steps.api.outputs.url }}" "$SHA"

      # Smoke E2E: one browser, the play-a-week journey. The full matrix runs on labelled PRs (CI-03).
      - name: Smoke E2E
        env:
          E2E_BASE_URL: https://main.fastlane-e6g.pages.dev
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e --project desktop-chromium e2e/play-a-week.spec.ts

      - name: Summary
        if: always()
        run: |
          {
            echo "### main deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${SHA}\` |"
            echo "| Web | https://${ALIAS}.${PAGES_HOST} |"
            echo "| API | ${{ steps.api.outputs.url }}/healthz |"
            echo "| Artifact | \`web-dist-${SHA}\` (promote with the production workflow) |"
          } >> "$GITHUB_STEP_SUMMARY"
