# CD-01: per-PR Worker preview alias + Pages preview, wired together through /config.json (CD-03).
# Opt-in: only PRs carrying the `preview` label deploy, to save Actions minutes.
name: preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: fastlane
  PAGES_HOST: fastlane-e6g.pages.dev
  ALIAS: pr-${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy:
    # Fork PRs get no secrets, so they get no preview. Skipped jobs cost no minutes.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.pages.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Upload Worker preview version
        id: api
        working-directory: apps/api
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --env preview \
            --preview-alias "$ALIAS" --var "VERSION:$SHA" --message "$ALIAS $SHA" 2>&1 | tee upload.log
          url=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          test -n "$url" || { echo "::error::No preview alias URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: pnpm --filter @fastlane/web build

      - name: Write runtime config
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          printf '{\n  "environment": "preview",\n  "apiBase": "%s"\n}\n' "$API_URL" > apps/web/dist/config.json
          cat apps/web/dist/config.json

      - name: Deploy Pages preview
        id: pages
        run: |
          pnpm --filter @fastlane/api exec wrangler pages deploy ../web/dist \
            --project-name "$PAGES_PROJECT" --branch "$ALIAS" --commit-hash "$SHA" --commit-dirty=true
          echo "url=https://${ALIAS}.${PAGES_HOST}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          API_URL: ${{ steps.api.outputs.url }}
          WEB_URL: ${{ steps.pages.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            version=$(curl -fsS -D - "$API_URL/healthz" -o /dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="x-fastlane-version"{print $2}') && [ "$version" = "$SHA" ] && break
            echo "API not ready yet (got '${version:-}'), retrying…"; sleep 5
          done
          [ "$version" = "$SHA" ] || { echo "::error::API version '$version' != $SHA"; exit 1; }
          for i in 1 2 3 4 5 6; do
            curl -fsS "$WEB_URL/config.json" | grep -qF "$API_URL" && break
            echo "Pages not ready yet, retrying…"; sleep 5
          done
          curl -fsS "$WEB_URL/config.json" | grep -qF "$API_URL"
          curl -fsS "$WEB_URL/" | grep -q '<div id="root">'

      # CI-03: Playwright against this PR's preview, desktop Chromium and mobile WebKit.
      - name: E2E
        env:
          E2E_BASE_URL: ${{ steps.pages.outputs.url }}
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm e2e

      # CI-05: Lighthouse CI on the preview URL; budgets in lighthouserc.json. Reuses Playwright's Chromium.
      - name: Lighthouse
        id: lighthouse
        env:
          WEB_URL: ${{ steps.pages.outputs.url }}
        run: |
          export CHROME_PATH=$(pnpm exec node -e "import('@playwright/test').then((m) => console.log(m.chromium.executablePath()))")
          # Pinned and run through dlx, not installed: its dependency tree carries audit advisories (CI-06).
          pnpm dlx @lhci/cli@0.15.1 autorun --collect.url="$WEB_URL/"

      - name: Lighthouse summary
        if: always() && steps.lighthouse.outcome != 'skipped'
        run: |
          node -e '
            const fs = require("node:fs");
            const runs = JSON.parse(fs.readFileSync(".lighthouseci/manifest.json", "utf8"));
            const rep = runs.find((r) => r.isRepresentativeRun) ?? runs[0];
            const rows = Object.entries(rep.summary).map(([k, v]) => `| ${k} | ${Math.round(v * 100)} |`);
            console.log(["### Lighthouse (median run)", "", "| Category | Score |", "|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY" || echo "No Lighthouse results" >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          API_URL: ${{ steps.api.outputs.url }}
          WEB_URL: ${{ steps.pages.outputs.url }}
        run: |
          marker='<!-- fastlane-preview -->'
          body=$(printf '%s\n### Preview ready\n\n| | URL |\n|---|---|\n| Web | %s |\n| API | %s/healthz |\n\nCommit `%s` · deployed %s UTC\n' \
            "$marker" "$WEB_URL" "$API_URL" "${SHA:0:7}" "$(date -u '+%Y-%m-%d %H:%M')")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
