# OPS-04 (simulator §8): the full balance run, choice assessment and the optimizer exploit search (SIM-09), the full
# E2E matrix against a local production build, and the dependency audit. Opens or updates one "Nightly report" issue
# when a hard band or check fails or the optimizer finds leads. Manual dispatch only for now: a run costs about 40
# Actions minutes (CI-04 moved the balance sim out of CI for that reason). To schedule it, add
#   schedule: [{ cron: '17 3 * * *' }]
name: nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      balance: ${{ steps.balance.outcome }}
      leads: ${{ steps.optimize.outputs.leads }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Balance run (hard bands fail)
        id: balance
        continue-on-error: true
        run: pnpm sim run --games 2000 --out sim-out/nightly
      - name: Choice assessment
        run: pnpm sim assess --games 300 --out sim-out/nightly-assess
      - name: Exploit search
        id: optimize
        run: |
          pnpm sim optimize --games 20 --out sim-out/nightly-optimize
          echo "leads=$(jq '.leads | length' sim-out/nightly-optimize/optimize.json)" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          for f in sim-out/nightly/summary.md sim-out/nightly-assess/assess.md sim-out/nightly-optimize/optimize.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-sim
          path: sim-out
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full E2E matrix
        env:
          CI: 'true'
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm e2e

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high

  report:
    needs: [sim, e2e, audit]
    if: >-
      always() && (needs.sim.result != 'success' || needs.e2e.result != 'success' ||
      needs.audit.result != 'success' || needs.sim.outputs.balance == 'failure' || needs.sim.outputs.leads != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BODY: |
        Nightly run: sim `${{ needs.sim.result }}` (balance bands `${{ needs.sim.outputs.balance }}`, optimizer leads `${{ needs.sim.outputs.leads }}`), E2E `${{ needs.e2e.result }}`, audit `${{ needs.audit.result }}`.
    steps:
      - name: Open or update the nightly issue
        run: |
          body="$BODY"$'\n'"Details and the sim reports (artifact \`nightly-sim\`): $RUN_URL"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Nightly report"' \
            --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "Nightly report" --body "$body"
          fi
